<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode - Laboratório</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: {
                    colors: { darkBg: '#09090b', neonBlue: '#3b82f6' }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans selection:bg-neonBlue selection:text-white">
    
    <!-- Navegação Flutuante -->
    <nav class="fixed top-6 left-1/2 transform -translate-x-1/2 w-[95%] max-w-5xl bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl z-50 px-6 py-4 flex justify-between items-center shadow-2xl">
        <a href="#" class="text-xl font-black text-white tracking-widest">RM//ACERVO</a>
        <div class="flex items-center gap-6">
            <a href="#" class="text-sm font-medium text-gray-400 hover:text-white transition">Features</a>
            <a href="cart.html" class="bg-neonBlue/20 text-neonBlue border border-neonBlue/50 px-4 py-2 rounded-xl text-sm font-bold hover:bg-neonBlue hover:text-white transition">
                Cart (<span id="cart-count">0</span>)
            </a>
        </div>
    </nav>

    <!-- Hero Section Imersivo com Brilho Radial -->
    <header class="relative pt-40 pb-20 lg:pt-56 lg:pb-32 px-6 overflow-hidden">
        <!-- Efeito de Luz de Fundo -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-neonBlue/20 rounded-full blur-[120px] pointer-events-none"></div>
        
        <div class="relative max-w-4xl mx-auto text-center">
            <div class="inline-block px-4 py-1 mb-6 rounded-full border border-white/10 bg-white/5 text-xs font-medium tracking-wide text-gray-300">
                Lançamento v2.0
            </div>
            <h1 class="text-5xl lg:text-7xl font-black text-white mb-8 tracking-tight leading-tight">
                Arquitetura de Alta <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">Performance.</span>
            </h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto mb-10 leading-relaxed">
                Desenvolvido com Jamstack. Velocidade absoluta, segurança sem banco de dados e uma experiência fluida para o seu usuário.
            </p>
        </div>
    </header>

    <!-- Área de Produtos -->
    <main class="relative z-10 max-w-7xl mx-auto px-6 lg:px-12 py-12">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Footer Simples Dark -->
    <footer class="border-t border-white/10 mt-20 py-12 text-center text-gray-500 text-sm">
        <p>Desenvolvido no Laboratório. Jamstack B2B.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
